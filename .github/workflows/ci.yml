name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: dotnet test tests/CombatProbabilityLab.Tests --configuration Release
      - name: Frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Frontend build
        working-directory: web
        run: npm run build
      - name: Frontend component tests
        working-directory: web
        run: npm run test
      - name: Publication boundary checks
        run: python3 scripts/check_publication.py

  containers:
    name: Build and smoke-test Docker containers
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build both production images
        run: docker compose build --pull --provenance=false
      - name: Start the composed application
        run: docker compose up --detach --no-build
      - name: Smoke test browser origin, API and reverse proxy
        run: python3 scripts/smoke_containers.py
      - name: Show container logs when something fails
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans

      # Publishing is restricted to successful pushes to the default branch.
      # PR builds never log into GHCR or publish unreviewed images.
      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish latest and immutable commit tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          for component in api web; do
            local_image="tac40k-$component:local"
            remote_image="ghcr.io/$owner/tac40k-$component"
            docker tag "$local_image" "$remote_image:sha-$short_sha"
            docker tag "$local_image" "$remote_image:latest"
            docker push "$remote_image:sha-$short_sha"
            docker push "$remote_image:latest"
          done
