name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: dotnet test tests/CombatProbabilityLab.Tests --configuration Release
      - name: Frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Frontend build
        working-directory: web
        run: npm run build
      - name: Publication boundary checks
        run: python3 scripts/check_publication.py
