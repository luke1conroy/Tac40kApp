server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep React and the API on the same origin; no browser-side CORS setup needed.
    # No trailing slash on proxy_pass: preserve the /api/* request path.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8080/health;
    }

    # For future client-side routes as well as the current single-page app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
